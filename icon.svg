<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#16293d"/>
      <stop offset="60%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#04070a"/>
    </radialGradient>

    <!-- Stadium Glow -->
    <radialGradient id="stadiumGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>

    <!-- Cricket Ball 3D Shading -->
    <radialGradient id="ballShade" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d32f2f"/>
      <stop offset="85%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- App Background Shape with Rounded Corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Stadium Lighting Glow Effect -->
  <circle cx="256" cy="220" r="220" fill="url(#stadiumGlow)"/>

  <!-- Outer Orbit Rings (Tech/Sport Vibe) -->
  <circle cx="256" cy="230" r="165" fill="none" stroke="#26384f" stroke-width="3" stroke-dasharray="10 14" opacity="0.6"/>
  <circle cx="256" cy="230" r="195" fill="none" stroke="#00e676" stroke-width="1.5" stroke-dasharray="6 20" opacity="0.4"/>

  <!-- Crossed Golden Cricket Bats Behind Ball -->
  <g filter="url(#dropShadow)" opacity="0.9">
    <!-- Bat 1 (Angled Left to Right) -->
    <g transform="translate(256, 230) rotate(-42) translate(-256, -230)">
      <!-- Handle -->
      <rect x="249" y="55" width="14" height="85" rx="5" fill="#f5f5f5"/>
      <rect x="250" y="65" width="12" height="8" fill="#e0e0e0"/>
      <rect x="250" y="85" width="12" height="8" fill="#e0e0e0"/>
      <rect x="250" y="105" width="12" height="8" fill="#e0e0e0"/>
      <!-- Blade -->
      <path d="M246 140 L266 140 L268 360 C268 375 244 375 244 360 Z" fill="url(#goldGrad)"/>
      <path d="M256 150 L256 360" stroke="#ff8f00" stroke-width="2.5" opacity="0.5"/>
    </g>
    <!-- Bat 2 (Angled Right to Left) -->
    <g transform="translate(256, 230) rotate(42) translate(-256, -230)">
      <!-- Handle -->
      <rect x="249" y="55" width="14" height="85" rx="5" fill="#f5f5f5"/>
      <rect x="250" y="65" width="12" height="8" fill="#e0e0e0"/>
      <rect x="250" y="85" width="12" height="8" fill="#e0e0e0"/>
      <rect x="250" y="105" width="12" height="8" fill="#e0e0e0"/>
      <!-- Blade -->
      <path d="M246 140 L266 140 L268 360 C268 375 244 375 244 360 Z" fill="url(#goldGrad)"/>
      <path d="M256 150 L256 360" stroke="#ff8f00" stroke-width="2.5" opacity="0.5"/>
    </g>
  </g>

  <!-- Central Cricket Ball -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="235" r="105" fill="url(#ballShade)"/>
    
    <!-- Ball Shine / Specular Highlight -->
    <ellipse cx="220" cy="180" rx="42" ry="24" fill="#ffffff" opacity="0.28" transform="rotate(-25 220 180)"/>

    <!-- Cricket Ball Seam (Curved Arc) -->
    <path d="M165 200 Q256 265 347 270" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <!-- Seam Stitching Marks -->
    <path d="M175 198 L170 208 M195 208 L190 218 M215 218 L210 228 M235 228 L230 238 M255 237 L250 247 M275 245 L270 255 M295 251 L290 261 M315 255 L310 265 M335 258 L330 268" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Speed Energy Ring Around Ball -->
  <circle cx="256" cy="235" r="120" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-dasharray="14 18" opacity="0.8"/>

  <!-- 3 Stars Above Ball -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Star Left -->
    <polygon points="170,115 174,127 187,127 176,134 180,146 170,138 160,146 164,134 153,127 166,127" transform="scale(0.8) translate(30, 10)"/>
    <!-- Star Center (Big) -->
    <polygon points="256,90 261,105 277,105 264,115 269,130 256,120 243,130 248,115 235,105 251,105"/>
    <!-- Star Right -->
    <polygon points="342,115 346,127 359,127 348,134 352,146 342,138 332,146 336,134 325,127 338,127" transform="scale(0.8) translate(95, 10)"/>
  </g>

  <!-- Text Branding: "CRICSCORE" & "PRO" -->
  <g filter="url(#dropShadow)" text-anchor="middle">
    <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="3">
      CRIC<tspan fill="#00e676">SCORE</tspan>
    </text>
    <rect x="220" y="435" width="72" height="26" rx="13" fill="url(#goldGrad)"/>
    <text x="256" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#000000" letter-spacing="2">
      PRO
    </text>
  </g>
</svg>
